# Test-only: Postgres behind PgBouncer in TRANSACTION mode (like Supabase's transaction pooler, port 6543).
# Used by tests/test_pooler.py via `make test-pooler`. Throwaway passwords; binds to 127.0.0.1 only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: localtest
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: pooler_app
      DB_PASSWORD: pooler_app_test
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "4"     # few server connections, many clients: maximises connection reuse
      MAX_CLIENT_CONN: "200"
      LISTEN_PORT: "6432"
    ports:
      - "127.0.0.1:56432:6432"
